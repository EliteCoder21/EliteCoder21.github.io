<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Multi-Agent Tanks policy network" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Multi-Agent Tanks policy network</title><rect width="1000" height="300" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6b12"/></marker></defs><rect x="20" y="100" width="140" height="90" rx="8" fill="#f4f5f7" stroke="#c9ced6"/><text x="32" y="126" font-size="15" font-weight="700" fill="#2c3e50">Observation</text><text x="32" y="146" font-size="12.5" fill="#5b6470">196 numbers:</text><text x="32" y="162" font-size="12.5" fill="#5b6470">self, radar, vision</text><rect x="210" y="100" width="160" height="90" rx="8" fill="#f4f5f7" stroke="#c9ced6"/><text x="222" y="126" font-size="15" font-weight="700" fill="#2c3e50">Encoder</text><text x="222" y="146" font-size="12.5" fill="#5b6470">2 x 512 layers</text><text x="222" y="162" font-size="12.5" fill="#5b6470">key, query, message</text><rect x="420" y="30" width="190" height="90" rx="8" fill="#f4f5f7" stroke="#c9ced6"/><text x="432" y="56" font-size="15" font-weight="700" fill="#2c3e50">Attention radio</text><text x="432" y="76" font-size="12.5" fill="#5b6470">listens to living teammates</text><text x="432" y="92" font-size="12.5" fill="#5b6470">through 4 heads (64-d msgs)</text><rect x="420" y="180" width="190" height="90" rx="8" fill="#f4f5f7" stroke="#c9ced6"/><text x="432" y="206" font-size="15" font-weight="700" fill="#2c3e50">Own state</text><text x="432" y="226" font-size="12.5" fill="#5b6470">the agent&#x27;s encoded</text><text x="432" y="242" font-size="12.5" fill="#5b6470">observation, as is</text><rect x="660" y="100" width="140" height="90" rx="8" fill="#f4f5f7" stroke="#c9ced6"/><text x="672" y="126" font-size="15" font-weight="700" fill="#2c3e50">GRU memory</text><text x="672" y="146" font-size="12.5" fill="#5b6470">512 units,</text><text x="672" y="162" font-size="12.5" fill="#5b6470">reset on death</text><rect x="850" y="100" width="130" height="90" rx="8" fill="#f4f5f7" stroke="#c9ced6"/><text x="862" y="126" font-size="15" font-weight="700" fill="#2c3e50">Heads</text><text x="862" y="146" font-size="12.5" fill="#5b6470">move, fire, special,</text><text x="862" y="162" font-size="12.5" fill="#5b6470">base order, block</text><line x1="163" y1="145" x2="207" y2="145" stroke="#9a6b12" stroke-width="2" marker-end="url(#a)"/><line x1="373" y1="125" x2="417" y2="90" stroke="#9a6b12" stroke-width="2" marker-end="url(#a)"/><line x1="373" y1="165" x2="417" y2="215" stroke="#9a6b12" stroke-width="2" marker-end="url(#a)"/><line x1="613" y1="90" x2="657" y2="125" stroke="#9a6b12" stroke-width="2" marker-end="url(#a)"/><line x1="613" y1="215" x2="657" y2="165" stroke="#9a6b12" stroke-width="2" marker-end="url(#a)"/><line x1="803" y1="145" x2="847" y2="145" stroke="#9a6b12" stroke-width="2" marker-end="url(#a)"/></svg>